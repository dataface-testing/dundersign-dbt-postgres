dundersign:
  target: prod
  outputs:
    prod:
      type: postgres
      host: "{{ env_var('DUNDERSIGN_PG_HOST') }}"
      port: "{{ env_var('DUNDERSIGN_PG_PORT', '5432') | int }}"
      user: "{{ env_var('DUNDERSIGN_PG_USER', 'dundersign_dbt') }}"
      password: "{{ env_var('DUNDERSIGN_PG_PASSWORD') }}"
      dbname: dundersign
      schema: analytics
      sslmode: "{{ env_var('DUNDERSIGN_PG_SSLMODE', 'require') }}"
      threads: 4
